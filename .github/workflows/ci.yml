name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            server/package.json
            client/package.json

      - name: Install Server Dependencies
        run: npm --prefix server ci

      - name: Install Client Dependencies
        run: npm --prefix client ci

      - name: Build Client (Vite)
        run: npm --prefix client run build

      - name: Verify Server Module Imports
        run: |
          node -e "
            import('./server/src/utils/chunker.js');
            import('./server/src/utils/pdfExtractor.js');
            import('./server/src/services/embeddingService.js');
            import('./server/src/services/ragService.js');
            import('./server/src/services/cacheService.js');
            console.log('All server modules imported successfully');
          "
