version: '3.8'

services:
  redis:
    image: redis:alpine
    container_name: docu_rag_redis
    ports:
      - '6379:6379'
    restart: unless-stopped
    volumes:
      - redis_data:/data

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: docu_rag_server
    ports:
      - '5000:5000'
    environment:
      - PORT=5000
      - MONGODB_URI=${MONGODB_URI}
      - JWT_SECRET=${JWT_SECRET}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - REDIS_URL=redis://redis:6379
      - CLIENT_URL=http://localhost:5173
    depends_on:
      - redis
    volumes:
      - ./server/uploads:/app/uploads
    restart: unless-stopped

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: docu_rag_client
    ports:
      - '5173:80'
    depends_on:
      - server
    restart: unless-stopped

volumes:
  redis_data:
